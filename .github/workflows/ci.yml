name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev + agent extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agent,cli]"

      - name: Import check (zero-dep core)
        run: python -c "import swarm_safety_gate as s; print(s.__version__); print(s.SafetyGate.validate_command('rm -rf /'))"

      - name: Run tests (LLM tests skipped by default)
        run: pytest -q

      - name: Reproducible safety benchmark
        run: python benchmarks/router_benchmark.py --seed 0 --n 200
